plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'com.vanniktech.maven.publish'
}

dependencies {
    api project(':engine')
    // Provided by the FTC robot controller app on a robot, and by the desktop module on a laptop.
    compileOnly "org.openpnp:opencv:$opencvVersion"
    compileOnly "com.google.code.gson:gson:$gsonVersion"
    compileOnly "org.nanohttpd:nanohttpd:$nanohttpdVersion"
}

mavenPublishing {
    coordinates(project.group.toString(), 'wolfvision-studio', project.version.toString())
    pom {
        name = 'WolfVision Studio'
        description = 'The optional tuning dashboard of WolfVision: builds and tunes a vision pipeline in a browser.'
    }
}
