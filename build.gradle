plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.20' apply false
}

ext {
    // The versions the FTC robot controller app provides at run time.
    opencvVersion = '4.7.0-0'
    gsonVersion = '2.8.0'
    nanohttpdVersion = '2.3.1'
}

allprojects {
    repositories {
        mavenCentral()
    }

    // Build output goes to a ".nosync" directory, which iCloud Drive does not sync. In a
    // synced folder, iCloud can evict build intermediates during a build and stall Gradle.
    layout.buildDirectory = layout.projectDirectory.dir('build.nosync')
}

subprojects {
    plugins.withId('org.jetbrains.kotlin.jvm') {
        // Targets Java 8, as the FTC SDK does, regardless of the JDK running the build.
        tasks.withType(JavaCompile).configureEach {
            options.release = 8
        }
        kotlin {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                freeCompilerArgs.add('-Xjdk-release=1.8')
            }
        }
    }
}
