plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    id 'com.android.library' version '8.13.2' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

ext {
    // OpenCV for the laptop. A robot uses the OpenCV of the FTC SDK instead (4.10 in SDK 12), so
    // only calls that both have are used.
    opencvVersion = '4.7.0-0'
    // The versions the FTC robot controller app provides at run time.
    gsonVersion = '2.8.0'
    nanohttpdVersion = '2.3.1'
    ftcVersion = '12.0.0'
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    // Build output goes to a ".nosync" directory, which iCloud Drive does not sync. In a
    // synced folder, iCloud can evict build intermediates during a build and stall Gradle.
    layout.buildDirectory = layout.projectDirectory.dir('build.nosync')
}

subprojects {
    plugins.withId('org.jetbrains.kotlin.jvm') {
        // Targets Java 8, as the FTC SDK does, regardless of the JDK running the build.
        tasks.withType(JavaCompile).configureEach {
            options.release = 8
        }
        kotlin {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
                freeCompilerArgs.add('-Xjdk-release=1.8')
            }
        }
    }

    // Publishing settings shared by every published module. Each module sets its own artifact
    // id, name and description.
    plugins.withId('com.vanniktech.maven.publish') {
        mavenPublishing {
            publishToMavenCentral()
            // Signing needs a key, which only release builds have. Local publishing works without.
            if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
                signAllPublications()
            }

            pom {
                url = 'https://github.com/RoboWolves10016/WolfVision'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'RoboWolves10016'
                        name = 'Clarkston RoboWolves 10016'
                        url = 'https://github.com/RoboWolves10016'
                    }
                }
                scm {
                    url = 'https://github.com/RoboWolves10016/WolfVision'
                    connection = 'scm:git:https://github.com/RoboWolves10016/WolfVision.git'
                    developerConnection = 'scm:git:ssh://git@github.com/RoboWolves10016/WolfVision.git'
                }
            }
        }
    }
}
